<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة مشاويري</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1c2733;--mu:#6b7785;--bd:#e1e6eb;--pr:#0f766e;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media all{:root:not([data-theme=light]){--bg:#10161c;--card:#1a232c;--tx:#e8eef3;--mu:#94a3b0;--bd:#2c3945;--pr:#0f9d8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;padding-bottom:76px}
header{background:var(--pr);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{padding:12px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input,select{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;font-size:17px;border:0;border-radius:12px;padding:13px;background:var(--pr);color:#fff;width:100%;margin-top:10px}
button.s{background:var(--bd);color:var(--tx)}button.d{background:var(--r)}
.dec{border-radius:16px;padding:16px;text-align:center;color:#fff;margin-bottom:12px;font-size:19px;font-weight:bold}
.dec small{display:block;font-weight:normal;font-size:14px;margin-top:6px}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k span{font-size:12px;color:var(--mu);display:block}.k b{font-size:20px}
.pos{color:var(--g)}.neg{color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 1px;font-size:11px;color:var(--mu)}nav a b{display:block;font-size:20px}nav a.on{color:var(--pr);font-weight:bold}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;gap:8px}
.it button{width:auto;padding:6px 10px;margin:0;font-size:13px}
.note{font-size:12px;color:var(--mu);margin-top:6px}
summary{font-size:18px;font-weight:bold;padding:14px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;margin-top:12px;list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.chips{display:flex;gap:8px;margin-top:8px}.chips .ch{margin:0;padding:10px;font-size:16px}
details[open]{background:var(--bg);border-radius:12px;padding-bottom:10px;margin-top:12px}details[open] summary{margin-top:0;border:0}details .row,details>div{padding:0 10px}details input{background:var(--card)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:right}
</style>
</head>
<body>
<header><h1>🚗 حاسبة مشاويري</h1><p>اعرف مكسبك قبل ما تقبل المشوار</p></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const DEF={gasPrice:170,gasKm:130,oilCost:700,oilKm:2000,gasoline:500,monthKm:2000,maint:1,comm:10,days:20,hours:4,target:60,minH:25,avgSpd:25};
const FIELDS=[['gasPrice','سعر تعبئة الغاز (جنيه)'],['gasKm','كم بتمشي بالتعبئة دي'],['oilCost','تكلفة تغيير الزيت (جنيه)'],['oilKm','كل كم بتغير الزيت'],['gasoline','مصروف البنزين الشهري (جنيه)'],['monthKm','إجمالي كم الشهر (للسيارة كلها)'],['maint','احتياطي صيانة لكل كم (جنيه)'],['comm','عمولة التطبيق %'],['days','أيام الشغل في الشهر'],['hours','ساعات الشغل يوميًا'],['target','هدف صافي الربح بالساعة (جنيه)'],['minH','أقل صافي ربح بالساعة مقبول (جنيه)'],['avgSpd','متوسط سرعتك مع الراكب (كم/س) - لتقدير المدة']];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=Object.assign({},DEF,ld('ind_s',{})),T=ld('ind_t',[]),E=ld('ind_e',[]),I=ld('ind_i',{dist:'',dur:'',pick:'',spd:30,price:'',ret:''}),tab='calc',selM=null,cmpM=null;
const n=v=>{v=parseFloat(v);return isFinite(v)&&v>=0?v:0};
const f=(v,d=0)=>(+v).toLocaleString('ar-EG',{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mon=d=>d.slice(0,7);
function perKm(s){const g=n(s.gasKm)>0?n(s.gasPrice)/n(s.gasKm):0,o=n(s.oilKm)>0?n(s.oilCost)/n(s.oilKm):0,b=n(s.monthKm)>0?n(s.gasoline)/n(s.monthKm):0,m=n(s.maint);return{g,o,b,m,t:g+o+b+m}}
function calc(i,s){
 const c=Math.min(n(s.comm),99)/100,p=perKm(s),spd=n(i.spd)>0?n(i.spd):30;
 const pickT=n(i.pick)/spd*60,retT=n(i.ret)/spd*60;
 const km=n(i.pick)+n(i.dist)+n(i.ret),min=(n(i.dur)||n(i.dist)/(n(s.avgSpd)||25)*60)+pickT+retT,hr=min/60;
 const cost=km*p.t,price=n(i.price),net=price*(1-c)-cost;
 const minF=Math.ceil((cost+hr*n(s.minH))/(1-c)),recF=Math.ceil((cost+hr*n(s.target))/(1-c));
 const nh=hr>0?net/hr:0;
 let st='r';if(net>=0&&nh>=n(s.target)-1e-9)st='g';else if(net>=0&&nh>=n(s.minH)-1e-9)st='y';
 return{c,p,km,min,hr,cost,price,net,minF,recF,nh,st,diff:price-recF,pickT,retT,dur:min-pickT-retT,est:!n(i.dur)}}
function head(t){return`<div class="card"><h2>${t}</h2>`}
function inp(id,l,v,step='any'){return`<div><label>${l}</label><input type="number" inputmode="decimal" min="0" step="${step}" id="${id}" value="${v}"></div>`}
function todayBar(){const D=new Date(),d=D.getFullYear()+'-'+String(D.getMonth()+1).padStart(2,'0')+'-'+String(D.getDate()).padStart(2,'0'),t=T.filter(x=>x.d==d),c=Math.min(n(S.comm),99)/100,v=t.reduce((a,x)=>a+x.rev,0)*(1-c)-t.reduce((a,x)=>a+x.est,0),h=t.reduce((a,x)=>a+x.min,0)/60;return`<div class="card" style="text-align:center;padding:10px">النهاردة: <b>${f(t.length)}</b> مشاوير • صافي تقديري <b class="${v>=0?'pos':'neg'}">${f(v)} ج</b>${h>0?' • '+f(v/h)+' ج/س':''}</div>`}
function renderCalc(){
 return todayBar()+head('📍 المشوار')+`<div class="row">${inp('price','💰 السعر المعروض',I.price)}${inp('dist','مسافة المشوار (كم)',I.dist)}</div><div class="chips"><button class="s ch" data-pp="-5">السعر −5</button><button class="s ch" data-pp="5">السعر +5</button></div>${inp('pick','بعدي عن الراكب (كم)',I.pick)}<div class="chips">${[1,2,3,5].map(v=>`<button class="s ch" data-p="${v}">${v} كم</button>`).join('')}</div><details><summary>⚙️ تفاصيل أكتر (مدة، سرعة، رجوع فاضي)</summary><div class="row">${inp('dur','المدة (دقيقة) — فاضي = تقدير',I.dur)}${inp('spd','سرعة الوصول (كم/س)',I.spd)}</div>${inp('ret','↩️ رجوع فاضي (كم)',I.ret)}</details><button class="s" id="clr">🔄 تصفير</button></div><div id="res"></div>`}
function renderRes(){
 const r=calc(I,S),el=document.getElementById('res');if(!el)return;
 const txt={g:['✅ اقبل المشوار','العرض بيحقق هدفك'],y:['⚠️ مقبول بالعافية','بيغطي التكلفة وأقل ربح، لكن تحت هدفك — فاوض لو تقدر'],r:['⛔ ارفض أو فاوض','العرض مش بيحقق الحد الأدنى']}[r.st];
 const ok=r.km>0&&r.price>0;
 el.innerHTML=(ok?`<div class="dec ${r.st}" style="font-size:26px">${txt[0]}<small>${txt[1]}</small><div style="font-size:34px;margin-top:8px">فاوض على ${f(r.recF)} ج</div><small>ابدأ بـ ${f(Math.ceil(r.recF*1.1))} ← هدفك ${f(r.recF)} ← متنزلش عن ${f(r.minF)}</small><small>صافي ربحك لو قبلت ${f(r.net)} ج${r.est?' • المدة تقدير':''}</small></div>`:`<div class="card note">اكتب المسافة والسعر عشان تظهر النتيجة</div>`)+
 `<div class="grid">
 <div class="k"><span>📏 إجمالي المسافة</span><b>${f(r.km,1)} كم</b></div>
 <div class="k"><span>⏱️ إجمالي الوقت</span><b>${f(r.min)} د</b></div>
 <div class="k"><span>⛽ تكلفة التشغيل (تقدير)</span><b>${f(r.cost,1)} ج</b></div>
 <div class="k"><span>💵 صافي ربحك لو قبلت</span><b class="${r.net>=0?'pos':'neg'}">${f(r.net,1)} ج</b></div>
 <div class="k"><span>صافي الربح/ساعة</span><b class="${r.st=='g'?'pos':r.st=='r'?'neg':''}">${f(r.nh)} ج</b></div>
 <div class="k"><span>التكلفة/كم</span><b>${f(r.p.t,2)} ج</b></div>
 <div class="k"><span>🔻 أقل سعر مقبول</span><b>${f(r.minF)} ج</b></div>
 <div class="k"><span>🎯 السعر العادل</span><b>${f(r.recF)} ج</b></div></div>
 <div class="card" style="margin-top:12px">الفرق بين العرض والسعر العادل: <b class="${r.diff>=0?'pos':'neg'}">${r.diff>=0?'+':''}${f(r.diff)} ج</b>
 <div class="note">تفصيل التكلفة/كم: غاز ${f(r.p.g,2)} + زيت ${f(r.p.o,2)} + بنزين ${f(r.p.b,2)} + صيانة ${f(r.p.m,2)}. عمولة ${f(r.c*100,1)}%. الرجوع الفاضي محسوب بنفس سرعة الوصول للراكب.</div>
 ${ok?`<button id="saveTrip">💾 سجّل المشوار في السجل</button><div id="sv"></div>`:''}</div>`;
 const b=document.getElementById('saveTrip');if(b)b.onclick=()=>saveTrip(r)}
function saveTrip(r){const sb=document.getElementById('sv');sb.innerHTML=`<div class="row">${inp('acc','السعر اللي اتقبل',r.price)}${inp('rev','الإيراد الفعلي (قبل العمولة)',r.price)}</div><button id="cfm">✅ تأكيد التسجيل</button>`;document.getElementById('cfm').onclick=()=>doSave(r)}
function doSave(r){
 const acc=document.getElementById('acc').value;
 const rev=document.getElementById('rev').value||acc;
 const d=new Date(),p2=x=>String(x).padStart(2,'0');
 T.push({id:Date.now(),d:`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,h:d.getHours(),km:+r.km.toFixed(2),min:+r.min.toFixed(1),dist:n(I.dist),pick:n(I.pick),ret:n(I.ret),off:r.price,acc:n(acc),rev:n(rev),est:+r.cost.toFixed(2)});
 sv('ind_t',T);document.getElementById('sv').innerHTML='<div class="note pos" style="font-size:15px">تم التسجيل ✅</div>'}
function renderLog(){
 const l=[...T].sort((a,b)=>b.id-a.id);
 return head('🧾 سجل المشاوير ('+f(T.length)+')')+(l.length?l.map(t=>`<div class="it"><div>${t.d} • ${t.h}:00<br><span class="note">${f(t.km,1)} كم • ${f(t.min)} د • عرض ${f(t.off)} • إيراد فعلي ${f(t.rev)}</span></div><button class="d" data-dt="${t.id}">حذف</button></div>`).join(''):'<p class="note">مفيش مشاوير متسجلة. احسب مشوار واضغط "سجّل".</p>')+`</div>`}
function renderExp(){
 const l=[...E].sort((a,b)=>b.id-a.id).slice(0,60);
 return head('➕ مصروف فعلي')+`<label>النوع</label><select id="et">${['غاز','بنزين','زيت','صيانة','إصلاح','أخرى'].map(x=>`<option>${x}</option>`).join('')}</select><div class="row">${inp('ea','المبلغ (جنيه)','')}${inp('ek','كم عدّاد (اختياري)','')}</div><label>التاريخ</label><input type="date" id="ed" value="${new Date().toISOString().slice(0,10)}"><label>ملاحظة</label><input id="en"><button id="addE">إضافة</button></div>`+head('المصروفات الأخيرة')+(l.length?l.map(e=>`<div class="it"><div>${e.d} • ${esc(e.t)} • <b>${f(e.a)} ج</b>${e.n?`<br><span class="note">${esc(e.n)}</span>`:''}</div><button class="d" data-de="${e.id}">حذف</button></div>`).join(''):'<p class="note">لسه مفيش مصروفات.</p>')+`</div>`}
function months(){return[...new Set([...T.map(t=>mon(t.d)),...E.map(e=>mon(e.d)),mon(new Date().toISOString())])].sort().reverse()}
function rep(m){
 const t=T.filter(x=>mon(x.d)==m),e=E.filter(x=>mon(x.d)==m),c=Math.min(n(S.comm),99)/100;
 const rev=t.reduce((a,x)=>a+x.rev,0),exp=e.reduce((a,x)=>a+x.a,0),km=t.reduce((a,x)=>a+x.km,0),min=t.reduce((a,x)=>a+x.min,0),est=t.reduce((a,x)=>a+x.est,0);
 const net=rev*(1-c)-exp,hr=min/60;
 const byT={};e.forEach(x=>byT[x.t]=(byT[x.t]||0)+x.a);
 const H={};t.forEach(x=>{const h=H[x.h]=H[x.h]||{n:0,p:0,m:0};h.n++;h.p+=x.rev*(1-c)-x.est;h.m+=x.min});
 const best=Object.entries(H).filter(([,v])=>v.m>0).map(([h,v])=>({h:+h,ph:v.p/(v.m/60),n:v.n})).sort((a,b)=>b.ph-a.ph);
 const good=t.filter(x=>x.min>0&&(x.rev*(1-c)-x.est)/(x.min/60)>=n(S.target)).length;
 return{m,t,rev,exp,km,min,hr,net,est,n:t.length,ph:hr>0?net/hr:0,pk:km>0?net/km:0,byT,best,good,avg:t.length?rev/t.length:0,ek:km>0?exp/km:0}}
function renderRep(){
 selM=selM||months()[0];const r=rep(selM);
 const o=months().map(m=>`<option ${m==selM?'selected':''}>${m}</option>`).join('');
 let h=head('📊 تقرير الشهر')+`<select id="sm">${o}</select></div>`+`<div class="grid">
 <div class="k"><span>الإيرادات (فعلي)</span><b>${f(r.rev)} ج</b></div>
 <div class="k"><span>المصروفات المسجلة (فعلي)</span><b>${f(r.exp)} ج</b></div>
 <div class="k"><span>صافي الربح الفعلي</span><b class="${r.net>=0?'pos':'neg'}">${f(r.net)} ج</b></div>
 <div class="k"><span>عدد المشاوير</span><b>${f(r.n)}</b></div>
 <div class="k"><span>إجمالي الكم</span><b>${f(r.km,1)}</b></div>
 <div class="k"><span>ساعات المشاوير</span><b>${f(r.hr,1)}</b></div>
 <div class="k"><span>ربح/ساعة</span><b>${f(r.ph)} ج</b></div>
 <div class="k"><span>ربح/كم</span><b>${f(r.pk,2)} ج</b></div>
 <div class="k"><span>متوسط قيمة المشوار</span><b>${f(r.avg)} ج</b></div>
 <div class="k"><span>مشاوير حققت الهدف</span><b>${r.n?f(r.good/r.n*100):0}%</b></div></div>
 <div class="card" style="margin-top:12px"><div class="note">الأرقام فوق مبنية على الإيراد الفعلي والمصروفات المسجلة فقط (بعد خصم عمولة ${f(n(S.comm))}%). تقدير تكلفة التشغيل للمشاوير حسب الحسابات: <b>${f(r.est)} ج</b> — تقدير مش مصروف فعلي. ملحوظة: ساعات الشغل هنا ساعات المشاوير المسجلة فقط، مش وقت الانتظار.</div></div>`;
 h+=head('توزيع المصروفات')+(Object.keys(r.byT).length?Object.entries(r.byT).map(([k,v])=>`<div class="it"><span>${esc(k)}</span><b>${f(v)} ج</b></div>`).join('')+`<div class="note">مصروفات/كم: ${f(r.ek,2)} ج</div>`:'<p class="note">مفيش مصروفات.</p>')+'</div>';
 h+=head('💡 توصيات')+`<div class="note" style="font-size:14px;color:var(--tx)">`+recs(r)+`</div></div>`;
 const ms=months();cmpM=cmpM&&ms.includes(cmpM)?cmpM:(ms[1]||ms[0]);
 const q=rep(cmpM);
 h+=head('⚖️ مقارنة بشهر تاني')+`<select id="cm">${ms.map(m=>`<option ${m==cmpM?'selected':''}>${m}</option>`).join('')}</select><div class="sc"><table><tr><th></th><th>${r.m}</th><th>${q.m}</th></tr>${[['إيرادات',r.rev,q.rev],['مصروفات',r.exp,q.exp],['صافي',r.net,q.net],['مشاوير',r.n,q.n],['كم',r.km,q.km],['ربح/ساعة',r.ph,q.ph],['مصروف/كم',r.ek,q.ek]].map(x=>`<tr><td>${x[0]}</td><td>${f(x[1],1)}</td><td>${f(x[2],1)}</td></tr>`).join('')}</table></div></div>`;
 h+=head('⬇️ تصدير')+`<button class="s" id="exT">تصدير المشاوير CSV</button><button class="s" id="exE">تصدير المصروفات CSV</button></div>`;
 return h}
function recs(r){
 if(!r.n)return'سجّل مشاوير الأول عشان تظهر توصيات.';
 const o=[],tg=n(S.target);
 if(r.ph<tg)o.push(`ربح الساعة الفعلي (${f(r.ph)} ج) أقل من هدفك (${f(tg)} ج).`);else o.push('ربح الساعة محقق الهدف 👍');
 if(r.n>=3&&r.good/r.n<.5)o.push('أقل من نص المشاوير حققت الهدف — ارفع حد القبول لسعر "العادل".');
 if(r.best.length)o.push(`أحسن ساعة بالربح: ${r.best[0].h}:00 (${f(r.best[0].ph)} ج/س من ${r.best[0].n} مشاوير).`+(r.best.length>1?` أضعف ساعة: ${r.best[r.best.length-1].h}:00.`:''));
 const p=months(),i=p.indexOf(r.m),pr=p[i+1];
 if(pr){const q=rep(pr);if(q.ek>0&&r.ek>q.ek*1.25)o.push('مصروف/كم زاد أكتر من 25% عن الشهر اللي قبله — راجع الغاز والصيانة.')}
 if(r.n<5)o.push('عدد المشاوير قليل، التوصيات تقريبية.');
 return o.map(x=>'• '+x).join('<br>')}
function renderSet(){
 const p=perKm(S);
 return head('⚙️ الإعدادات')+`<div class="row">${FIELDS.map(([k,l])=>inp('s_'+k,l,S[k])).join('')}</div><div class="note">تكلفة التشغيل الحالية: <b>${f(p.t,2)} ج/كم</b> (غاز ${f(p.g,2)} • زيت ${f(p.o,2)} • بنزين ${f(p.b,2)} • صيانة ${f(p.m,2)})</div><button class="d" id="rst">رجوع للإعدادات الافتراضية</button></div><div class="note">البيانات محفوظة على الجهاز فقط (localStorage). امسح بيانات المتصفح = تضيع، فصدّر نسخة CSV كل فترة.</div>`}
function csv(rows,name){
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function show(){
 const V={calc:renderCalc,log:renderLog,exp:renderExp,rep:renderRep,set:renderSet};

 if(tab=='calc')renderRes();bind()}
function bind(){
 document.querySelectorAll('[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();tab=a.dataset.t;show()});
 ['dist','dur','pick','spd','price','ret'].forEach(k=>{const el=document.getElementById(k);if(el)el.oninput=()=>{I[k]=el.value;sv('ind_i',I);renderRes()}});
 const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{I={dist:'',dur:'',pick:'',spd:I.spd||30,price:'',ret:''};sv('ind_i',I);show()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{I.pick=b.dataset.p;sv('ind_i',I);show()});document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{I.price=Math.max(0,n(I.price)+ +b.dataset.pp);sv('ind_i',I);show()});
 FIELDS.forEach(([k])=>{const el=document.getElementById('s_'+k);if(el)el.oninput=()=>{S[k]=el.value===''?0:n(el.value);sv('ind_s',S);const x=document.querySelector('.note b');if(x)x.textContent=f(perKm(S).t,2)+' ج/كم'}});
 document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{if(b.dataset.c){T=T.filter(x=>x.id!=b.dataset.dt);sv('ind_t',T);show()}else{b.dataset.c=1;b.textContent='تأكيد؟'}});
 document.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>{if(b.dataset.c){E=E.filter(x=>x.id!=b.dataset.de);sv('ind_e',E);show()}else{b.dataset.c=1;b.textContent='تأكيد؟'}});
 const ae=document.getElementById('addE');if(ae)ae.onclick=()=>{const a=n(document.getElementById('ea').value);if(!a){document.getElementById('ea').style.borderColor='var(--r)';return}E.push({id:Date.now(),t:document.getElementById('et').value,a,k:n(document.getElementById('ek').value),d:document.getElementById('ed').value||new Date().toISOString().slice(0,10),n:document.getElementById('en').value});sv('ind_e',E);show()};
 const sm=document.getElementById('sm');if(sm)sm.onchange=()=>{selM=sm.value;show()};
 const cm=document.getElementById('cm');if(cm)cm.onchange=()=>{cmpM=cm.value;show()};
 const r=document.getElementById('rst');if(r)r.onclick=()=>{if(r.dataset.c){S=Object.assign({},DEF);sv('ind_s',S);show()}else{r.dataset.c=1;r.textContent='اضغط تاني للتأكيد'}};
 const x1=document.getElementById('exT');if(x1)x1.onclick=()=>csv([['التاريخ','الساعة','كم','دقائق','السعر المعروض','السعر المقبول','الإيراد الفعلي','تكلفة تشغيل تقديرية'],...T.map(t=>[t.d,t.h,t.km,t.min,t.off,t.acc,t.rev,t.est])],'trips.csv');
 const x2=document.getElementById('exE');if(x2)x2.onclick=()=>csv([['التاريخ','النوع','المبلغ','عدّاد','ملاحظة'],...E.map(e=>[e.d,e.t,e.a,e.k,e.n])],'expenses.csv')}
show();
</script>
<script>
/* ===== v3: نظام الإدارة والتحليل ===== */
const CATS=['غاز','بنزين','زيت','صيانة','إصلاح','أخرى'],DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],DL=['أقل من 5 كم','5–10 كم','10–20 كم','+20 كم'],FL=['أقل من 40 ج','40–70 ج','70–100 ج','+100 ج'];
let ET=null,EE=null,LM=null;
const $=id=>document.getElementById(id);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const p2=x=>String(x).padStart(2,'0');
const nowD=()=>{const D=new Date();return D.getFullYear()+'-'+p2(D.getMonth()+1)+'-'+p2(D.getDate())};
const nowT=()=>{const D=new Date();return p2(D.getHours())+':'+p2(D.getMinutes())};
const bk=(v,a)=>{let i=0;while(i<a.length&&v>=a[i])i++;return i};
const K=(l,v,c='')=>`<div class="k"><span>${l}</span><b class="${c}">${v}</b></div>`;
const inM=(m)=>agg(T.filter(x=>mon(x.d)==m),E.filter(x=>mon(x.d)==m));
/* التجميع: مصروفات نقدية فعلية + احتياطي صيانة (تقدير) بدون خصم مزدوج */
function agg(t,e){
 const c=Math.min(n(S.comm),99)/100,rev=sum(t,'rev'),km=sum(t,'km'),min=sum(t,'min'),cash=sum(e,'a');
 const mc=sum(e.filter(x=>x.t=='صيانة'||x.t=='إصلاح'),'a'),prov=Math.max(0,km*n(S.maint)-mc),comm=rev*c,net=rev-comm-cash-prov,hr=min/60,N=t.length;
 const good=t.filter(x=>x.min>0&&(x.rev*(1-c)-x.est)/(x.min/60)>=n(S.target)).length;
 return{N,rev,km,min,hr,cash,comm,prov,net,good,est:sum(t,'est'),ph:hr>0?net/hr:0,pk:km>0?net/km:0,aRev:N?rev/N:0,aNet:N?net/N:0}}
function sg(a){return'<div class="grid">'+[K('💵 الإيرادات (قبل العمولة)',f(a.rev)+' ج'),K('➖ عمولة التطبيق',f(a.comm)+' ج'),K('⛽ مصروفات نقدية فعلية',f(a.cash)+' ج'),K('🔧 احتياطي صيانة (تقدير)',f(a.prov)+' ج'),K('✅ صافي الربح بعد كل التكاليف',f(a.net)+' ج',a.net>=0?'pos':'neg'),K('🧮 تكلفة تشغيل تقديرية (للمقارنة فقط)',f(a.est)+' ج'),K('🚗 المشاوير',f(a.N)),K('📏 الكيلومترات',f(a.km,1)),K('⏱️ ساعات المشاوير',f(a.hr,1)),K('متوسط الإيراد/مشوار',f(a.aRev)+' ج'),K('متوسط الصافي/مشوار',f(a.aNet)+' ج'),K('صافي/ساعة',f(a.ph)+' ج',a.N&&a.ph>=n(S.target)?'pos':''),K('صافي/كم',f(a.pk,2)+' ج'),K('🎯 حققت الهدف',a.N?f(a.good/a.N*100)+'%':'—')].join('')+'</div>'}
function grp(t,key,c){const o={};t.forEach(x=>{const k=key(x);const g=o[k]=o[k]||{n:0,net:0,min:0};g.n++;g.net+=x.rev*(1-c)-x.est;g.min+=x.min});return Object.entries(o).map(([k,g])=>({k,n:g.n,net:g.net,ph:g.min>0?g.net/(g.min/60):0,a:g.net/g.n}))}
function tbl(rows,lab){return rows.length?`<div class="sc"><table><tr><th></th><th>مشاوير</th><th>صافي/مشوار</th><th>صافي/ساعة</th></tr>${rows.map(r=>`<tr><td>${lab(r.k)}</td><td>${r.n}</td><td>${f(r.a)}</td><td class="${r.ph>=n(S.target)?'pos':r.ph<n(S.minH)?'neg':''}">${f(r.ph)}</td></tr>`).join('')}</table></div>`:'<p class="note">مفيش بيانات.</p>'}
function bars(t,v,l,col){const neg=v.some(x=>x<0),base=neg?50:72,sc=neg?32:55,mx=Math.max(1,...v.map(Math.abs)),w=300/v.length;
 return`<div class="note" style="margin-top:10px">${t}</div><svg viewBox="0 0 300 102" style="width:100%;color:var(--mu)">`+v.map((x,i)=>{const h=Math.abs(x)/mx*sc,y=x>=0?base-h:base;return`<rect x="${i*w+6}" y="${y}" width="${w-12}" height="${Math.max(h,1)}" rx="3" fill="${x<0?'#dc2626':col}"/><text x="${i*w+w/2}" y="${x>=0?y-3:y+h+10}" font-size="9" text-anchor="middle" fill="currentColor">${f(x)}</text><text x="${i*w+w/2}" y="99" font-size="10" text-anchor="middle" fill="currentColor">${l[i]}</text>`}).join('')+'</svg>'}
function warn(a){return a.N&&!a.cash?'<div class="card note" style="color:var(--y)">⚠️ مفيش مصروفات نقدية متسجلة في الفترة دي، فالصافي مبالغ فيه. سجّل الغاز والبنزين والزيت.</div>':''}
const note0='<div class="note">الصافي = الإيراد − العمولة − المصروفات النقدية الفعلية − احتياطي الصيانة. الاحتياطي = كم المشاوير × احتياطي الكم، وبيتخصم منه أي صيانة/إصلاح فعلي مسجل عشان ميتحسبش مرتين. تكلفة التشغيل التقديرية للمقارنة فقط ومش بتتخصم. المصروفات بتتسجل يوم الشراء فصافي اليوم ممكن يتأرجح.</div>';
/* الرئيسية */
function renderDash(){
 const d=nowD(),m=d.slice(0,7),a=agg(T.filter(x=>x.d==d),E.filter(x=>x.d==d)),b=inM(m),tg=n(S.target)*n(S.days)*n(S.hours),pc=tg?Math.max(0,Math.min(100,b.net/tg*100)):0;
 const mini=x=>'<div class="grid">'+[K('🚗 مشاوير',f(x.N)),K('💵 إيراد',f(x.rev)+' ج'),K('💸 مصروفات (نقدي+احتياطي)',f(x.cash+x.prov)+' ج'),K('✅ صافي',f(x.net)+' ج',x.net>=0?'pos':'neg'),K('صافي/ساعة',f(x.ph)+' ج'),K('📏 كم',f(x.km,1))].join('')+'</div>';
 return head('📅 النهاردة')+mini(a)+warn(a)+'</div>'+head('🗓️ الشهر ('+m+')')+mini(b)+`<div class="note" style="margin-top:10px">هدف الشهر حسب إعداداتك: ${f(tg)} ج صافي — المحقق ${f(pc)}%</div><div style="height:10px;background:var(--bd);border-radius:6px;margin-top:6px"><div style="height:10px;width:${pc}%;background:var(--g);border-radius:6px"></div></div></div>`+note0}
/* سجل المشاوير */
function tripForm(t){const tm=t.tm||(t.h!=null?p2(t.h)+':00':nowT());
 return head(t.id?'✏️ تعديل مشوار':'➕ تسجيل مشوار')+`<div class="row"><div><label>التاريخ</label><input type="date" id="f_d" value="${t.d||nowD()}"></div><div><label>الوقت</label><input type="time" id="f_tm" value="${tm}"></div>${inp('f_pick','المسافة للراكب (كم)',t.pick??'')}${inp('f_pm','مدة الوصول (د)',t.pm??'')}${inp('f_dist','مسافة المشوار (كم)',t.dist??'')}${inp('f_dur','مدة المشوار (د)',t.dur??'')}${inp('f_ret','رجوع فاضي (كم)',t.ret??'')}${inp('f_rm','مدة الرجوع (د)',t.rm??'')}${inp('f_off','السعر المعروض',t.off??'')}${inp('f_acc','السعر المتفق عليه',t.acc??'')}</div>${inp('f_rev','الإيراد الفعلي (قبل العمولة)',t.rev??'')}<div class="row"><button id="tsv">حفظ</button><button class="s" id="tcx">إلغاء</button></div></div>`}
function saveT(){
 const g=k=>$('f_'+k).value,tm=g('tm')||'00:00',o={id:ET.id||Date.now(),d:g('d')||nowD(),tm,h:+tm.slice(0,2),pick:n(g('pick')),pm:n(g('pm')),dist:n(g('dist')),dur:n(g('dur')),ret:n(g('ret')),rm:n(g('rm')),off:n(g('off')),acc:n(g('acc')),rev:n(g('rev'))};
 o.km=+(o.pick+o.dist+o.ret).toFixed(2);o.min=+(o.pm+o.dur+o.rm).toFixed(1);
 const old=ET.id&&T.find(x=>x.id==ET.id);
 o.est=+(o.km*perKm(S).t).toFixed(2);
 if(!o.km||!o.rev){$(o.km?'f_rev':'f_dist').style.borderColor='var(--r)';return}
 const i=T.findIndex(x=>x.id==o.id);if(i>=0)T[i]=o;else T.push(o);sv('ind_t',T);ET=null;show()}
function doSave(r){
 const acc=$('acc').value,rev=$('rev').value||acc,tm=nowT();
 T.push({id:Date.now(),d:nowD(),tm,h:+tm.slice(0,2),pick:n(I.pick),pm:+r.pickT.toFixed(1),dist:n(I.dist),dur:+r.dur.toFixed(1),ret:n(I.ret),rm:+r.retT.toFixed(1),off:r.price,acc:n(acc),rev:n(rev),km:+r.km.toFixed(2),min:+r.min.toFixed(1),est:+r.cost.toFixed(2)});
 sv('ind_t',T);$('sv').innerHTML='<div class="note pos" style="font-size:15px">تم التسجيل ✅</div>'}
function renderLog(){
 if(ET)return tripForm(ET);
 const ms=months();LM=LM&&(LM=='all'||ms.includes(LM))?LM:ms[0];
 const key=x=>x.d+(x.tm||p2(x.h)+':00'),l=T.filter(x=>LM=='all'||mon(x.d)==LM).sort((a,b)=>key(b).localeCompare(key(a)));
 return head('🧾 سجل المشاوير')+`<select id="lm"><option value="all" ${LM=='all'?'selected':''}>كل الشهور</option>${ms.map(x=>`<option ${x==LM?'selected':''}>${x}</option>`).join('')}</select><button id="addT">➕ تسجيل مشوار يدوي</button></div>`+head(f(l.length)+' مشوار')+(l.length?l.map(t=>`<div class="it"><div>${t.d} • ${t.tm||p2(t.h)+':00'}<br><span class="note">${f(t.km,1)} كم • ${f(t.min)} د • عرض ${f(t.off)} • متفق ${f(t.acc)} • إيراد ${f(t.rev)}</span></div><div><button class="s" data-et="${t.id}">تعديل</button> <button class="d" data-dt="${t.id}">حذف</button></div></div>`).join(''):'<p class="note">مفيش مشاوير.</p>')+'</div>'}
/* المصروفات */
function expForm(e){return head(e.id?'✏️ تعديل مصروف':'➕ مصروف نقدي فعلي')+`<label>النوع</label><select id="g_t">${CATS.map(x=>`<option ${x==e.t?'selected':''}>${x}</option>`).join('')}</select><div class="row">${inp('g_a','المبلغ (جنيه)',e.a??'')}${inp('g_k','قراءة العدّاد (اختياري)',e.k||'')}</div><label>التاريخ</label><input type="date" id="g_d" value="${e.d||nowD()}"><label>ملاحظة</label><input id="g_n" value="${esc(e.n||'')}"><div class="row"><button id="esv">${e.id?'حفظ':'إضافة'}</button>${e.id?'<button class="s" id="ecx">إلغاء</button>':''}</div></div>`}
function saveE(){const a=n($('g_a').value);if(!a){$('g_a').style.borderColor='var(--r)';return}
 const o={id:EE&&EE.id||Date.now(),t:$('g_t').value,a,k:n($('g_k').value),d:$('g_d').value||nowD(),n:$('g_n').value},i=E.findIndex(x=>x.id==o.id);if(i>=0)E[i]=o;else E.push(o);sv('ind_e',E);EE=null;show()}
function renderExp(){
 const l=[...E].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,80);
 return expForm(EE||{})+'<div class="card note">دي مصروفات نقدية فعلية فقط. احتياطي الصيانة تقدير بيتحسب لوحده، ولو سجلت صيانة/إصلاح فعلي بيتخصم من الاحتياطي (مفيش خصم مزدوج).</div>'+head('آخر المصروفات')+(l.length?l.map(e=>`<div class="it"><div>${e.d} • ${esc(e.t)} • <b>${f(e.a)} ج</b>${e.n?`<br><span class="note">${esc(e.n)}</span>`:''}</div><div><button class="s" data-ee="${e.id}">تعديل</button> <button class="d" data-de="${e.id}">حذف</button></div></div>`).join(''):'<p class="note">لسه مفيش مصروفات.</p>')+'</div>'}
/* التقارير */
function recs(r,H,Dk,F,pv){
 if(!r.N)return'سجّل مشاوير الأول عشان تظهر توصيات.';const o=[];
 o.push(r.ph>=n(S.target)?'صافي الساعة محقق الهدف 👍':`صافي الساعة (${f(r.ph)} ج) أقل من هدفك (${f(S.target)} ج).`);
 if(r.N>=5&&r.good/r.N<.5)o.push('أقل من نص المشاوير حققت الهدف — ارفع حد القبول للسعر العادل.');
 if(H.length>1)o.push(`أحسن ساعة: ${H[0].k}:00 (${f(H[0].ph)} ج/س) • أضعف: ${H[H.length-1].k}:00 (${f(H[H.length-1].ph)} ج/س).`);
 [...Dk.map(x=>[DL[x.k],x]),...F.map(x=>[FL[x.k],x])].filter(([,x])=>x.n>=3&&x.ph<n(S.minH)).forEach(([l,x])=>o.push(`فئة "${l}" صافيها ${f(x.ph)} ج/س (تحت الحد الأدنى) — فاوض أو ارفض.`));
 if(pv&&pv.cash>0&&pv.km>0&&r.km>0&&r.cash/r.km>pv.cash/pv.km*1.25)o.push('المصروف النقدي/كم زاد أكتر من 25% عن الشهر اللي قبله — راجع الغاز والصيانة.');
 if(r.N<10)o.push('عدد المشاوير قليل، التحليل تقريبي.');
 return o.map(x=>'• '+x).join('<br>')}
function rows(a){const q=(x,d=2)=>+x.toFixed(d);return[['إيرادات',q(a.rev)],['عمولة',q(a.comm)],['مصروفات نقدية',q(a.cash)],['احتياطي صيانة (تقدير)',q(a.prov)],['صافي الربح',q(a.net)],['تكلفة تشغيل تقديرية (للمقارنة)',q(a.est)],['مشاوير',a.N],['كم',q(a.km,1)],['ساعات',q(a.hr)],['متوسط إيراد/مشوار',q(a.aRev)],['متوسط صافي/مشوار',q(a.aNet)],['صافي/ساعة',q(a.ph)],['صافي/كم',q(a.pk)],['نسبة الهدف %',a.N?q(a.good/a.N*100,1):0]]}
function renderRep(){
 const ms=months();selM=selM&&ms.includes(selM)?selM:ms[0];const m=selM,t=T.filter(x=>mon(x.d)==m),r=inM(m),c=Math.min(n(S.comm),99)/100;
 const H=grp(t,x=>x.h,c).sort((a,b)=>b.ph-a.ph),W=grp(t,x=>new Date(x.d+'T12:00').getDay(),c).sort((a,b)=>b.ph-a.ph),D=grp(t,x=>x.d,c).sort((a,b)=>b.net-a.net),Dk=grp(t,x=>bk(x.km,[5,10,20]),c).sort((a,b)=>a.k-b.k),F=grp(t,x=>bk(x.rev,[40,70,100]),c).sort((a,b)=>a.k-b.k);
 const pv=ms[ms.indexOf(m)+1]?inM(ms[ms.indexOf(m)+1]):null;
 let h=head('📊 تقرير شهري')+`<select id="sm">${ms.map(x=>`<option ${x==m?'selected':''}>${x}</option>`).join('')}</select></div>`+warn(r)+sg(r)+note0;
 h+=head('💡 توصيات')+`<div style="font-size:14px">${recs(r,H,Dk,F,pv)}</div></div>`;
 h+=head('⏰ حسب ساعة اليوم (صافي تقديري)')+tbl(H,k=>k+':00')+'</div>'+head('📆 حسب يوم الأسبوع')+tbl(W,k=>DN[k])+'</div>';
 if(D.length)h+=head('🏆 أفضل وأسوأ يوم')+`<div class="it"><span>أفضل: ${D[0].k}</span><b class="pos">${f(D[0].net)} ج</b></div><div class="it"><span>أسوأ: ${D[D.length-1].k}</span><b class="${D[D.length-1].net<0?'neg':''}">${f(D[D.length-1].net)} ج</b></div></div>`;
 h+=head('📏 حسب مسافة المشوار')+tbl(Dk,k=>DL[k])+'</div>'+head('💰 حسب قيمة المشوار')+tbl(F,k=>FL[k])+'<div class="note">التحليلات دي بتستخدم تكلفة التشغيل التقديرية المحفوظة لكل مشوار.</div></div>';
 const asc=[...ms].reverse().slice(-6),A=asc.map(inM),L=asc.map(x=>x.slice(2));
