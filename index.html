const _bindIntegrated=bind;bind=function(){_bindIntegrated();document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{dashPeriod=b.dataset.period;if(dashPeriod==='custom'){dashFrom=dashFrom||nowD();dashTo=dashTo||nowD()}show()});const df=$('dashFrom'),dt=$('dashTo');if(df)df.onchange=()=>{dashFrom=df.value;if(dashTo&&dashFrom>dashTo)dashTo=dashFrom;show()};if(dt)dt.onchange=()=>{dashTo=dt.value;if(dashFrom&&dashTo<dashFrom)dashFrom=dashTo;show()};const fd=$('finishDay');if(fd)fd.onclick=()=>{dashPeriod='today';show()}};
