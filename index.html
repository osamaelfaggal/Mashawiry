 o.km=+(o.pick+o.dist+o.ret).toFixed(2);o.min=+(o.pm+o.dur+o.rm).toFixed(1);
 const old=ET.id&&T.find(x=>x.id==ET.id);
 o.est=+(o.km*perKm(S).t).toFixed(2);
 if(!o.km||!o.rev){$(o.km?'f_rev':'f_dist').style.borderColor='var(--r)';return}
 const i=T.findIndex(x=>x.id==o.id);if(i>=0)T[i]=o;else T.push(o);sv('ind_t',T);ET=null;show()}
function doSave(r){
 const acc=$('acc').value,rev=$('rev').value||acc,tm=nowT();
 T.push({id:Date.now(),d:nowD(),tm,h:+tm.slice(0,2),pick:n(I.pick),pm:+r.pickT.toFixed(1),dist:n(I.dist),dur:+r.dur.toFixed(1),ret:n(I.ret),rm:+r.retT.toFixed(1),off:r.price,acc:n(acc),rev:n(rev),km:+r.km.toFixed(2),min:+r.min.toFixed(1),est:+r.cost.toFixed(2)});
 sv('ind_t',T);$('sv').innerHTML='<div class="note pos" style="font-size:15px">تم التسجيل ✅</div>'}
function renderLog(){

 const key=x=>x.d+(x.tm||p2(x.h)+':00'),l=T.filter(x=>LM=='all'||mon(x.d)==LM).sort((a,b)=>key(b).localeCompare(key(a)));
 return head('🧾 سجل المشاوير')+`<select id="lm"><option value="all" ${LM=='all'?'selected':''}>كل الشهور</option>${ms.map(x=>`<option ${x==LM?'selected':''}>${x}</option>`).join('')}</select><button id="addT">➕ تسجيل مشوار يدوي</button></div>`+head(f(l.length)+' مشوار')+(l.length?l.map(t=>`<div class="it"><div>${t.d} • ${t.tm||p2(t.h)+':00'}<br><span class="note">${f(t.km,1)} كم • ${f(t.min)} د • عرض ${f(t.off)} • متفق ${f(t.acc)} • إيراد ${f(t.rev)}</span></div><div><button class="s" data-et="${t.id}">تعديل</button> <button class="d" data-dt="${t.id}">حذف</button></div></div>`).join(''):'<p class="note">مفيش مشاوير.</p>')+'</div>'}
/* المصروفات */
function expForm(e){return head(e.id?'✏️ تعديل مصروف':'➕ مصروف نقدي فعلي')+`<label>النوع</label><select id="g_t">${CATS.map(x=>`<option ${x==e.t?'selected':''}>${x}</option>`).join('')}</select><div class="row">${inp('g_a','المبلغ (جنيه)',e.a??'')}${inp('g_k','قراءة العدّاد (اختياري)',e.k||'')}</div><label>التاريخ</label><input type="date" id="g_d" value="${e.d||nowD()}"><label>ملاحظة</label><input id="g_n" value="${esc(e.n||'')}"><div class="row"><button id="esv">${e.id?'حفظ':'إضافة'}</button>${e.id?'<button class="s" id="ecx">إلغاء</button>':''}</div></div>`}
function saveE(){const a=n($('g_a').value);if(!a){$('g_a').style.borderColor='var(--r)';return}
 const o={id:EE&&EE.id||Date.now(),t:$('g_t').value,a,k:n($('g_k').value),d:$('g_d').value||nowD(),n:$('g_n').value},i=E.findIndex(x=>x.id==o.id);if(i>=0)E[i]=o;else E.push(o);sv('ind_e',E);EE=null;show()}
function renderExp(){
 const l=[...E].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,80);
 return expForm(EE||{})+'<div class="card note">دي مصروفات نقدية فعلية فقط. احتياطي الصيانة تقدير بيتحسب لوحده، ولو سجلت صيانة/إصلاح فعلي بيتخصم من الاحتياطي (مفيش خصم مزدوج).</div>'+head('آخر المصروفات')+(l.length?l.map(e=>`<div class="it"><div>${e.d} • ${esc(e.t)} • <b>${f(e.a)} ج</b>${e.n?`<br><span class="note">${esc(e.n)}</span>`:''}</div><div><button class="s" data-ee="${e.id}">تعديل</button> <button class="d" data-de="${e.id}">حذف</button></div></div>`).join(''):'<p class="note">لسه مفيش مصروفات.</p>')+'</div>'}
/* التقارير */
function recs(r,H,Dk,F,pv){
 if(!r.N)return'سجّل مشاوير الأول عشان تظهر توصيات.';const o=[];
 o.push(r.ph>=n(S.target)?'صافي الساعة محقق الهدف 👍':`صافي الساعة (${f(r.ph)} ج) أقل من هدفك (${f(S.target)} ج).`);
 if(r.N>=5&&r.good/r.N<.5)o.push('أقل من نص المشاوير حققت الهدف — ارفع حد القبول للسعر العادل.');
 if(H.length>1)o.push(`أحسن ساعة: ${H[0].k}:00 (${f(H[0].ph)} ج/س) • أضعف: ${H[H.length-1].k}:00 (${f(H[H.length-1].ph)} ج/س).`);
 [...Dk.map(x=>[DL[x.k],x]),...F.map(x=>[FL[x.k],x])].filter(([,x])=>x.n>=3&&x.ph<n(S.minH)).forEach(([l,x])=>o.push(`فئة "${l}" صافيها ${f(x.ph)} ج/س (تحت الحد الأدنى) — فاوض أو ارفض.`));
 if(pv&&pv.cash>0&&pv.km>0&&r.km>0&&r.cash/r.km>pv.cash/pv.km*1.25)o.push('المصروف النقدي/كم زاد أكتر من 25% عن الشهر اللي قبله — راجع الغاز والصيانة.');
 if(r.N<10)o.push('عدد المشاوير قليل، التحليل تقريبي.');
 return o.map(x=>'• '+x).join('<br>')}
function rows(a){const q=(x,d=2)=>+x.toFixed(d);return[['إيرادات',q(a.rev)],['عمولة',q(a.comm)],['مصروفات نقدية',q(a.cash)],['احتياطي صيانة (تقدير)',q(a.prov)],['صافي الربح',q(a.net)],['تكلفة تشغيل تقديرية (للمقارنة)',q(a.est)],['مشاوير',a.N],['كم',q(a.km,1)],['ساعات',q(a.hr)],['متوسط إيراد/مشوار',q(a.aRev)],['متوسط صافي/مشوار',q(a.aNet)],['صافي/ساعة',q(a.ph)],['صافي/كم',q(a.pk)],['نسبة الهدف %',a.N?q(a.good/a.N*100,1):0]]}
function renderRep(){
 const ms=months();selM=selM&&ms.includes(selM)?selM:ms[0];const m=selM,t=T.filter(x=>mon(x.d)==m),r=inM(m),c=Math.min(n(S.comm),99)/100;
 const H=grp(t,x=>x.h,c).sort((a,b)=>b.ph-a.ph),W=grp(t,x=>new Date(x.d+'T12:00').getDay(),c).sort((a,b)=>b.ph-a.ph),D=grp(t,x=>x.d,c).sort((a,b)=>b.net-a.net),Dk=grp(t,x=>bk(x.km,[5,10,20]),c).sort((a,b)=>a.k-b.k),F=grp(t,x=>bk(x.rev,[40,70,100]),c).sort((a,b)=>a.k-b.k);
 const pv=ms[ms.indexOf(m)+1]?inM(ms[ms.indexOf(m)+1]):null;
 let h=head('📊 تقرير شهري')+`<select id="sm">${ms.map(x=>`<option ${x==m?'selected':''}>${x}</option>`).join('')}</select></div>`+warn(r)+sg(r)+note0;
 h+=head('💡 توصيات')+`<div style="font-size:14px">${recs(r,H,Dk,F,pv)}</div></div>`;
 h+=head('⏰ حسب ساعة اليوم (صافي تقديري)')+tbl(H,k=>k+':00')+'</div>'+head('📆 حسب يوم الأسبوع')+tbl(W,k=>DN[k])+'</div>';
 if(D.length)h+=head('🏆 أفضل وأسوأ يوم')+`<div class="it"><span>أفضل: ${D[0].k}</span><b class="pos">${f(D[0].net)} ج</b></div><div class="it"><span>أسوأ: ${D[D.length-1].k}</span><b class="${D[D.length-1].net<0?'neg':''}">${f(D[D.length-1].net)} ج</b></div></div>`;
 h+=head('📏 حسب مسافة المشوار')+tbl(Dk,k=>DL[k])+'</div>'+head('💰 حسب قيمة المشوار')+tbl(F,k=>FL[k])+'<div class="note">التحليلات دي بتستخدم تكلفة التشغيل التقديرية المحفوظة لكل مشوار.</div></div>';
 const asc=[...ms].reverse().slice(-6),A=asc.map(inM),L=asc.map(x=>x.slice(2));
 h+=head('📈 تطور الشهور')+bars('الإيرادات',A.map(a=>a.rev),L,'#16a34a')+bars('المصروفات (نقدي + احتياطي)',A.map(a=>a.cash+a.prov),L,'#d97706')+bars('صافي الربح',A.map(a=>a.net),L,'#0f9d8f')+bars('الكيلومترات',A.map(a=>a.km),L,'#6b7785')+'</div>';
 cmpM=cmpM&&ms.includes(cmpM)?cmpM:(ms[1]||ms[0]);const q=inM(cmpM);
 h+=head('⚖️ مقارنة شهر بشهر')+`<select id="cm">${ms.map(x=>`<option ${x==cmpM?'selected':''}>${x}</option>`).join('')}</select><div class="sc"><table><tr><th></th><th>${m}</th><th>${cmpM}</th></tr>${[['إيرادات',r.rev,q.rev],['مصروفات نقدية',r.cash,q.cash],['احتياطي',r.prov,q.prov],['صافي',r.net,q.net],['مشاوير',r.N,q.N],['كم',r.km,q.km],['صافي/ساعة',r.ph,q.ph],['صافي/كم',r.pk,q.pk]].map(x=>`<tr><td>${x[0]}</td><td>${f(x[1],1)}</td><td>${f(x[2],1)}</td></tr>`).join('')}</table></div></div>`;
 h+=head('⬇️ تصدير (CSV يفتح في Excel)')+'<button class="s" id="xm">تقرير الشهر</button><button class="s" id="xa">ملخص كل الشهور</button><button class="s" id="xt">كل المشاوير</button><button class="s" id="xe">كل المصروفات</button></div>';
 return h}
/* النسخ الاحتياطي */
function backupCard(){return head('💾 نسخة احتياطية')+'<button class="s" id="bk">تنزيل نسخة احتياطية (JSON)</button><label style="margin-top:12px">استعادة من نسخة (بتستبدل كل البيانات الحالية)</label><input type="file" id="imp" accept=".json,application/json"><div id="bkm" class="note"></div></div>'}
const _rs=renderSet;renderSet=function(){return _rs()+backupCard()};
const _bind=bind;
bind=function(){_bind();
 const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
 document.querySelectorAll('[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();ET=EE=null;tab=a.dataset.t;show();scrollTo(0,0)});
 document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{ET=Object.assign({},T.find(x=>x.id==b.dataset.et));if(ET.dur==null){ET.dur=ET.min;ET.pm=0;ET.rm=0}show();scrollTo(0,0)});
 document.querySelectorAll('[data-ee]').forEach(b=>b.onclick=()=>{EE=Object.assign({},E.find(x=>x.id==b.dataset.ee));show();scrollTo(0,0)});
 on('addT',()=>{ET={};show()});on('tsv',saveT);on('tcx',()=>{ET=null;show()});on('esv',saveE);on('ecx',()=>{EE=null;show()});

 document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{dashPeriod=b.dataset.period;if(dashPeriod==='custom'){dashFrom=dashFrom||nowD();dashTo=dashTo||nowD()}show()});
 const df=$('dashFrom'),dt=$('dashTo');
 if(df)df.onchange=()=>{dashFrom=df.value;if(dashTo&&dashFrom>dashTo)dashTo=dashFrom;show()};
 if(dt)dt.onchange=()=>{dashTo=dt.value;if(dashFrom&&dashTo<dashFrom)dashFrom=dashTo;show()};
 on('finishDay',()=>{dashPeriod='today';show()});
 const lm=$('lm');if(lm)lm.onchange=()=>{LM=lm.value;show()};
 on('xm',()=>csv([['البند','القيمة'],...rows(inM(selM))],'report-'+selM+'.csv'));
 on('xa',()=>{const ms=months().slice().reverse(),R=ms.map(inM);csv([['البند',...ms],...rows(R[0]||agg([],[])).map((r,i)=>[r[0],...R.map(a=>rows(a)[i][1])])],'months-summary.csv')});
 on('xt',()=>csv([['التاريخ','الوقت','كم للراكب','مدة الوصول','كم المشوار','مدة المشوار','رجوع فاضي كم','مدة الرجوع','إجمالي كم','إجمالي دقائق','سعر معروض','سعر متفق','إيراد فعلي','تكلفة تشغيل تقديرية'],...T.map(t=>[t.d,t.tm||p2(t.h)+':00',t.pick||0,t.pm||0,t.dist||0,t.dur||0,t.ret||0,t.rm||0,t.km,t.min,t.off,t.acc,t.rev,t.est])],'trips.csv'));
 on('xe',()=>csv([['التاريخ','النوع','المبلغ','العدّاد','ملاحظة'],...E.map(e=>[e.d,e.t,e.a,e.k,e.n])],'expenses.csv'));
 on('bk',()=>{const b=new Blob([JSON.stringify({v:1,S,T,E})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mashawiri-backup-'+nowD()+'.json';a.click()});
 const im=$('imp');if(im)im.onchange=()=>{const fl=im.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.T)||!Array.isArray(o.E)||typeof o.S!='object')throw 0;S=Object.assign({},DEF,o.S);T=o.T;E=o.E;sv('ind_s',S);sv('ind_t',T);sv('ind_e',E);$('bkm').textContent='تمت الاستعادة ✅ ('+T.length+' مشوار، '+E.length+' مصروف)'}catch(x){$('bkm').textContent='الملف مش نسخة صالحة'}};rd.readAsText(fl)};
};
function show(){

 $('m').innerHTML=V[tab]();
 $('nav').innerHTML=[['dash','▦','الرئيسية'],['log','◷','المشاوير'],['calc','＋',''],['exp','♧','المصروفات'],['rep','▥','التقارير']].map(([k,i,l])=>`<a href="#" data-t="${k}" class="${tab==k?'on':''} ${k==='calc'?'nav-add':''}"><b>${i}</b>${l}</a>`).join('');
